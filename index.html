{const sx=Math.round(hero.x-camX);const blink=hero.inv>0&&Math.floor(t*12)%2===0;if(!blink&&ok('run')){ctx.save();ctx.translate(sx,0);if(hero.face<0)ctx.scale(-1,1);if(umbReady()){drawHeroUmb();}else if(!hero.ground&&ok('jump')){const f=hero.vy<-2?4:5;const bot=f===4?72:82;ctx.drawImage(imgs.jump,f*90,0,90,90,-45,Math.round(hero.y-bot),90,90);}else if(!hero.ground){ctx.drawImage(imgs.run,2*86,0,86,86,-43,Math.round(hero.y-86),86,86);}else if(hero.land>0&&ok('jump')){const f=hero.land>0.08?6:7;ctx.drawImage(imgs.jump,f*90,0,90,90,-45,Math.round(hero.y-90),90,90);}else if(hero.waveT>0&&Math.abs(hero.vx)<=0.3&&ok('wave')){const f=Math.min(7,Math.floor((1-hero.waveT)*8));ctx.drawImage(imgs.wave,f*90,0,90,90,-45,Math.round(hero.y-90),90,90);}else if(Math.abs(hero.vx)>0.3){const f=Math.floor(hero.runT)%8;ctx.drawImage(imgs.run,f*86,0,86,86,-43,Math.round(hero.y-86),86,86);}else if(near&&started&&ok('heroAct')){const f=Math.floor(t*8)%8;ctx.drawImage(imgs.heroAct,f*90,0,90,90,-45,Math.round(hero.y-90),90,90);}else if(ok('idle')){const f=Math.floor(t*7)%8;ctx.drawImage(imgs.idle,f*90,0,90,90,-45,Math.round(hero.y-90),90,90);}else if(ok('hero')){ctx.drawImage(imgs.hero,-40,Math.round(hero.y-79));}ctx.restore();}}
parts.forEach((p)=>px(ctx,p.x-camX,p.y,p.s,p.s,p.col));
if(ok('fg'))drawLayer(mir('fg'),1.3,H-84);drawRain();if(LTN>0.02){ctx.fillStyle='rgba(235,240,255,'+(LTN*0.55).toFixed(3)+')';ctx.fillRect(0,0,W,H);}
if(nt>0.02){ctx.fillStyle='rgba(6,12,36,'+(nt*0.26).toFixed(3)+')';ctx.fillRect(0,0,W,H);FLIES.forEach((f,i)=>{const x=((f.x-camX*0.9)%W+W)%W+Math.sin(t*f.sp+f.p)*14;const y=f.y+Math.cos(t*f.sp*1.3+f.p)*10;const a=nt*(0.4+0.6*Math.max(0,Math.sin(t*2.2+f.p)));ctx.globalAlpha=a*0.35;px(ctx,x-2,y-2,5,5,'#FFE58A');ctx.globalAlpha=a;px(ctx,x,y,2,2,'#FFF7C2');});ctx.globalAlpha=1;}
if(ok('flowers'))drawLayer(mir('flowers'),1,GY-20);else tufts.forEach((tf)=>{const sx=tf.x-camX;if(sx<-4||sx>W+4)return;const sw=Math.round(Math.sin(t*2+tf.x)*1);px(ctx,sx,GY-tf.h,2,tf.h,'#4FA64A');px(ctx,sx+sw+2,GY-tf.h+2,2,tf.h-2,'#6CCB5F');if(tf.f){px(ctx,sx+sw,GY-tf.h-3,4,3,tf.f);}});drawCritters();
if(near&&started&&!paused){const sx=Math.round(near.x-camX);const ty=near.type;const oy=ty==='chest'?near.y-58:(ty==='nona'?GY-236:(ty==='welcome'?GY-150:(ty==='mail'?GY-120:(ty==='kiosk'?GY-130:(ty==='secret'?GY-96:GY-160)))));const label='E  '+tr(near.label).toUpperCase();ctx.font='8px Silkscreen, monospace';const w=Math.round(ctx.measureText(label).width)+16;const bob=Math.round(Math.sin(t*5)*2);px(ctx,sx-w/2,oy-10+bob,w,20,'#15131F');px(ctx,sx-w/2,oy-10+bob,w,2,'#6FE3C1');px(ctx,sx-w/2,oy+8+bob,w,2,'#6FE3C1');px(ctx,sx-3,oy+10+bob,6,4,'#15131F');text(label,sx,oy+bob,8,'#6FE3C1');}
if(!started){ctx.fillStyle='rgba(12,10,22,0.25)';ctx.fillRect(0,0,W,H);}}
let last=performance.now(),accum=0;
function frame(now){accum+=Math.min(0.1,(now-last)/1000);last=now;const step=1/60;while(accum>=step){update(step);accum-=step;}draw();requestAnimationFrame(frame);}
const go=()=>requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){Promise.race([document.fonts.load('8px Silkscreen'),new Promise((r)=>setTimeout(r,1500))]).then(go);}else go();
})();
